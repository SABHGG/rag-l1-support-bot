<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L1 Support Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/static/app.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: 'var(--color-surface)',
            accent: 'var(--color-accent)',
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-gray-950 text-gray-100 flex flex-col">

  <!-- Header -->
  <header class="flex-none px-4 py-3 border-b border-gray-800 bg-gray-900 flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm select-none">
      L1
    </div>
    <div>
      <h1 class="text-sm font-semibold text-gray-100 leading-tight">L1 Support Bot</h1>
      <p class="text-xs text-gray-500">RAG-powered ticket assistant</p>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <span id="status-indicator" class="w-2 h-2 rounded-full bg-green-500" title="Connected"></span>
    </div>
  </header>

  <!-- Message area -->
  <main id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-4 scroll-smooth">

    <!-- Empty state -->
    <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center py-16 select-none">
      <div class="w-16 h-16 rounded-2xl bg-gray-800 flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-4 4z" />
        </svg>
      </div>
      <p class="text-gray-400 text-sm max-w-xs">Ask me anything about your support tickets...</p>
    </div>

  </main>

  <!-- Input bar -->
  <footer class="flex-none border-t border-gray-800 bg-gray-900 px-4 py-3">
    <div class="flex items-end gap-3 max-w-3xl mx-auto">
      <div class="flex-1 relative">
        <textarea
          id="user-input"
          rows="1"
          placeholder="Type a message... (Enter to send, Shift+Enter for newline)"
          class="w-full resize-none rounded-xl bg-gray-800 border border-gray-700 text-gray-100 text-sm px-4 py-3 pr-12 placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
          style="max-height: 150px; overflow-y: auto;"
        ></textarea>
      </div>
      <button
        id="stop-btn"
        class="hidden flex-none px-4 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-medium transition-colors"
        title="Stop generation"
      >
        &#9632; Stop
      </button>
      <button
        id="send-btn"
        class="flex-none px-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium transition-colors"
        title="Send (Enter)"
      >
        Send
      </button>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
